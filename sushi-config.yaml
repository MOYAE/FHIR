id: moyae.fhir.ophthalmology
canonical: https://fhir.moyae.com
name: MoyaeFhirOphthalmology
title: "Moyae Ophthalmology FHIR Implementation Guide"
description: "Implementation Guide for the ophthalmology FHIR resources the Moyae EMR emits: Visual Acuity, Intraocular Pressure and Refraction observations, VisionPrescription and its extensions. Documents the current shape and the target shape it is converging on with peer ophthalmology guides."
status: draft
version: 0.1.1
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build
license: CC0-1.0

publisher:
  name: Moyae, Inc.
  url: https://moyae.com
  email: partnerships@moyae.com

contact:
  - name: Moyae, Inc.
    telecom:
      - system: url
        value: https://moyae.com
      - system: email
        value: partnerships@moyae.com

dependencies:
  hl7.fhir.us.core: 6.1.0

parameters:
  show-inherited-invariants: false
  apply-publisher: true
  apply-version: true
  # These resources are deliberately published at the URLs the Moyae API already
  # writes (under moyae.com) rather than under the IG canonical, so whitelist them.
  special-url:
    - https://moyae.com/is-cc
    - https://moyae.com/fhir/CodeSystem/lens-material
    - https://moyae.com/fhir/StructureDefinition/vision-prescription-source-observation
    - https://moyae.com/fhir/StructureDefinition/lens-material
    - https://moyae.com/fhir/StructureDefinition/balance-lens
    - https://moyae.com/StructureDefinition/filter-by-profile
    - https://moyae.com/StructureDefinition/filter-by-resource-type

pages:
  index.md:
    title: Home
  relationships.md:
    title: Relationships and caveats
  subscriptions.md:
    title: Subscriptions
  history.md:
    title: History

menu:
  Home: index.html
  Artifacts: artifacts.html
  Relationships: relationships.html
  Subscriptions: subscriptions.html
  History: history.html
